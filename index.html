<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xoá nền ảnh - Remove.bg</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --panel2:#eef1f5; --border:#d8dde5;
    --accent:#2f6fed; --text:#1a2333; --muted:#5b6575; --danger:#e11d48;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:linear-gradient(160deg,#ffffff,#f2f4f8);
    color:var(--text); min-height:100vh; padding:24px;
  }
  h1{font-size:22px; margin:0 0 4px; font-weight:600;}
  p.sub{color:var(--muted); margin:0 0 20px; font-size:14px;}
  .wrap{max-width:1200px; margin:0 auto;}

  .layout{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:18px; flex:1 1 280px; min-width:260px;
  }
  .canvas-panel{
    flex:2 1 560px; min-width:320px;
    background:
      linear-gradient(45deg,#d5dae2 25%,transparent 25%),
      linear-gradient(-45deg,#d5dae2 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#d5dae2 75%),
      linear-gradient(-45deg,transparent 75%,#d5dae2 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#f1f3f6;
    border:1px solid var(--border); border-radius:14px;
    padding:14px; display:flex; align-items:center; justify-content:center;
    min-height:420px; position:relative; overflow:auto;
  }
  canvas{max-width:100%; border-radius:6px;}
  .drop{
    border:2px dashed var(--border); border-radius:10px; padding:26px 14px;
    text-align:center; color:var(--muted); cursor:pointer; font-size:14px; width:100%;
  }
  .drop:hover{border-color:var(--accent); color:var(--text);}
  input[type=file]{display:none;}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    padding:10px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); border-color:var(--accent); color:#ffffff; font-weight:600;}
  button.primary:hover{filter:brightness(1.08); color:#ffffff;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin-top:10px;}
  .status{font-size:13px; margin-top:12px; min-height:18px;}
  .status.ok{color:var(--accent);}
  .status.err{color:var(--danger);}
  .status.busy{color:var(--accent);}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:24px;}
  .spinner{
    display:inline-block; width:14px; height:14px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>CHUYỂN ẢNH NỀN TRẮNG - VIETINBANK BÌNH THUẬN</h1>
  <p class="sub">Tự động xoá nền ảnh và hiển thị trên nền trắng.</p>

  <div class="layout">
    <div class="canvas-panel" id="canvasPanel">
      <div class="drop" id="dropZone">
        📂 Kéo thả ảnh vào đây, hoặc bấm để chọn ảnh<br><small>(JPG, PNG, WEBP...)</small>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="panel">
      <input type="file" id="fileInput" accept="image/*">
      <div class="hint">
        Ảnh sẽ được gửi tới dịch vụ <b>Remove.bg</b> để xoá nền. Kết quả hiển thị trên nền trắng.
      </div>
      <div class="btns">
        <button id="runBtn" class="primary" disabled style="flex:1;">✨ Tách nền</button>
      </div>
      <div class="btns">
        <button id="downloadBtn" disabled style="flex:1;">⬇️ Tải PNG (nền trắng)</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <footer>Xoá nền bằng dịch vụ Remove.bg.</footer>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const runBtn = document.getElementById('runBtn');
const downloadBtn = document.getElementById('downloadBtn');
const status = document.getElementById('status');

const API_KEY = 'tku8QuAk6JJEnnXQybz1F5TX';
let currentFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = 'var(--border)');
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = 'var(--border)';
  if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if(e.target.files.length) loadFile(e.target.files[0]); });

function loadFile(file){
  if(!file.type.startsWith('image/')) return alert('Vui lòng chọn 1 file ảnh.');
  currentFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width; canvas.height = img.height;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0);
      dropZone.style.display = 'none';
      canvas.style.display = 'block';
      runBtn.disabled = false;
      downloadBtn.disabled = false;
      status.textContent = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function drawOnWhiteBackground(img, w, h){
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, 0, 0);
}

runBtn.addEventListener('click', async () => {
  if(!currentFile) return;
  runBtn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>Đang gửi ảnh tới Remove.bg...';
  status.className = 'status busy';
  try{
    const formData = new FormData();
    formData.append('image_file', currentFile);
    formData.append('size', 'auto');

    const response = await fetch('https://api.remove.bg/v1.0/removebg', {
      method: 'POST',
      headers: { 'X-Api-Key': API_KEY },
      body: formData
    });

    if(!response.ok){
      let msg = 'Lỗi API (' + response.status + ')';
      try{
        const errJson = await response.json();
        if(errJson.errors && errJson.errors[0]) msg = errJson.errors[0].title || msg;
      }catch(e){}
      throw new Error(msg);
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      drawOnWhiteBackground(img, img.width, img.height);
      URL.revokeObjectURL(url);
      status.textContent = '✅ Đã xoá nền xong. Kết quả hiển thị trên nền trắng.';
      status.className = 'status ok';
    };
    img.src = url;
  }catch(err){
    console.error(err);
    status.textContent = '❌ ' + (err.message || 'Lỗi không xác định') + '. Kiểm tra lại API key hoặc hạn mức tài khoản.';
    status.className = 'status err';
  }finally{
    runBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'anh-nen-trang.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
